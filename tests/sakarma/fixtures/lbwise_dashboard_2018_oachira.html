<!DOCTYPE html>

<body>
<form name="aspnetForm" method="post" action="/Pages/LBWiseDashBoard.aspx" id="aspnetForm">
<input type="hidden" name="__VIEWSTATE" id="__VIEWSTATE" value="FAKE_VIEWSTATE_2018" />
<input type="hidden" name="__VIEWSTATEGENERATOR" id="__VIEWSTATEGENERATOR" value="ABCD1234" />

    <option value="2" selected="selected">കൊല്ലം</option>
    <option value="3">പത്തനംതിട്ട</option>
    <option value="4">ആലപ്പുഴ</option>
    <option value="5">കോട്ടയം</option>
    <option value="6">ഇടുക്കി</option>
    <option value="7">എറണാകുളം</option>
    <option value="8">തൃശ്ശൂർ</option>
    <option value="9">പാലക്കാട്</option>
    <option value="10">മലപ്പുറം</option>
    <option value="11">കോഴിക്കോട്</option>
    <option value="12">വയനാട്</option>
    <option value="13">കണ്ണൂർ</option>
    <option value="14">കാസർഗോഡ്</option>
  </select>

  <select name="ctl00$ContentPlaceHolder1$ddlLBType" id="ctl00_ContentPlaceHolder1_ddlLBType">
    <option value="0">----തദ്ദേശ സ്ഥാപന തരം----</option>
    <option value="1">കോർപ്പറേഷൻ</option>
    <option value="2">മുൻസിപ്പാലിറ്റി</option>
    <option value="3">ബ്ലോക്ക് പഞ്ചായത്ത്</option>
    <option value="4">ജില്ലാ പഞ്ചായത്ത്</option>
    <option value="5" selected="selected">ഗ്രാമ പഞ്ചായത്ത്</option>
  </select>

  <select name="ctl00$ContentPlaceHolder1$ddlYear" id="ctl00_ContentPlaceHolder1_ddlYear">
    <option value="0">----വർഷം----</option>
    <option value="18" selected="selected">2018</option>
    <option value="19">2019</option>
    <option value="20">2020</option>
  </select>

  <select name="ctl00$ContentPlaceHolder1$ddlMainGroup" id="ctl00_ContentPlaceHolder1_ddlMainGroup">
    <option value="0">----ഗ്രൂപ്പ്----</option>
    <option value="1" selected="selected">ഭരണസമിതി</option>
    <option value="2">വികസന സമിതി</option>
  </select>

  <select name="ctl00$ContentPlaceHolder1$ddlLBName" id="ctl00_ContentPlaceHolder1_ddlLBName">

    <option value="301">ഓടനാവട്ടം</option>
    <option value="303" selected="selected">ഓച്ചിറ</option>
  </select>

  <!-- KPI cards — 2018 era: uses older Bootstrap "panel" pattern instead of
       "col kpi-card". The card container uses class="panel panel-default kpi-card"
       and the number is in an <h2> rather than <h3>. This structural drift is
       intentional: it exercises the parser's tolerance for older HTML shapes.
       See test_parser_canary.py for regression notes. -->
  <div class="row">

    <div class="col-md-2 panel panel-default kpi-card">
      <div class="panel-body">
        <h2 id="ctl00_ContentPlaceHolder1_lblTotal">22</h2>
        <p>ആകെ യോഗങ്ങൾ</p>
      </div>
    </div>

    <div class="col-md-2 panel panel-default kpi-card">
      <div class="panel-body">
        <h2 id="ctl00_ContentPlaceHolder1_lblOngoing">1</h2>
        <p>ചേരുന്ന യോഗങ്ങള്‍</p>
      </div>
    </div>

    <div class="col-md-2 panel panel-default kpi-card">
      <div class="panel-body">
        <h2 id="ctl00_ContentPlaceHolder1_lblMinComp">20</h2>
        <p>മിനിറ്റ്സ് പൂര്‍ത്തിയായവ</p>

    </div>

    <div class="col-md-2 panel panel-default kpi-card">

        <h2 id="ctl00_ContentPlaceHolder1_lblMinIncomp">1</h2>

      </div>
    </div>

    <div class="col-md-2 panel panel-default kpi-card">
      <div class="panel-body">
        <h2 id="ctl00_ContentPlaceHolder1_lblCancelled">0</h2>
        <p>മീറ്റിംഗ് റദ്ദ്‌ ആക്കിയവ</p>
      </div>
    </div>

  </div><!-- /.row -->

  <!-- 2018 era: meeting grid uses a capitalization variation in its table id.
       "GridMeetingDetails" (capital D, lowercase tails) vs the 2025 form
       "GridMeetingDEtails" (capital DE). This is a known schema-drift risk. -->
  <table id="ctl00_ContentPlaceHolder1_GridMeetingDetails">
    <tr>
      <th>നം.</th>
      <th>യോഗ നം.</th>
      <th>തീയതി</th>
      <th>യോഗ തരം</th>
      <th>സ്വഭാവം</th>
      <th>സ്ഥലം</th>
      <th>DR</th>
      <th>മിനിറ്റ്സ്</th>
    </tr>
    <tr>
      <td>1</td>
      <td>01/2018</td>
      <td>10/04/2018</td>
      <td>ഭരണസമിതി യോഗം</td>
      <td>സാധാരണ യോഗം</td>
      <td>ഓച്ചിറ പഞ്ചായത്ത് ഹാൾ</td>
      <td><a href="javascript:__doPostBack('ctl00$ContentPlaceHolder1$GridMeetingDetails$ctl02$lnkDR','')">DR</a></td>
      <td><a href="javascript:__doPostBack('ctl00$ContentPlaceHolder1$GridMeetingDetails','Select$0')">Min</a></td>
    </tr>
  </table>

</div><!-- /#ContentPlaceHolder1 -->
