<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8" />
  <title>LBWise DashBoard – SAKARMA</title>
</head>
<body>
<form name="aspnetForm" method="post" action="/Pages/LBWiseDashBoard.aspx" id="aspnetForm">
<input type="hidden" name="__VIEWSTATE" id="__VIEWSTATE" value="FAKE_VIEWSTATE_VALUE" />
<input type="hidden" name="__VIEWSTATEGENERATOR" id="__VIEWSTATEGENERATOR" value="ABCD1234" />
<input type="hidden" name="__VIEWSTATEENCRYPTED" id="__VIEWSTATEENCRYPTED" value="" />
<input type="hidden" name="__EVENTVALIDATION" id="__EVENTVALIDATION" value="FAKE_EVENTVALIDATION" />
<input type="hidden" name="__EVENTTARGET" id="__EVENTTARGET" value="" />
<input type="hidden" name="__EVENTARGUMENT" id="__EVENTARGUMENT" value="" />
<input type="hidden" name="__LASTFOCUS" id="__LASTFOCUS" value="" />

<div id="ContentPlaceHolder1">

  <!-- Cascading dropdowns -->
  <select name="ctl00$ContentPlaceHolder1$ddlDistrict" id="ctl00_ContentPlaceHolder1_ddlDistrict">
    <option value="0">----ജില്ല തിരഞ്ഞെടുക്കുക----</option>
    <option value="1">തിരുവനന്തപുരം</option>
    <option value="2" selected="selected">കൊല്ലം</option>
    <option value="3">പത്തനംതിട്ട</option>
    <option value="4">ആലപ്പുഴ</option>
    <option value="5">കോട്ടയം</option>
    <option value="6">ഇടുക്കി</option>
    <option value="7">എറണാകുളം</option>
    <option value="8">തൃശ്ശൂർ</option>
    <option value="9">പാലക്കാട്</option>
    <option value="10">മലപ്പുറം</option>
    <option value="11">കോഴിക്കോട്</option>
    <option value="12">വയനാട്</option>
    <option value="13">കണ്ണൂർ</option>
    <option value="14">കാസർഗോഡ്</option>
  </select>

  <select name="ctl00$ContentPlaceHolder1$ddlLBType" id="ctl00_ContentPlaceHolder1_ddlLBType">
    <option value="0">----തദ്ദേശ സ്ഥാപന തരം----</option>
    <option value="1">കോർപ്പറേഷൻ</option>
    <option value="2">മുൻസിപ്പാലിറ്റി</option>
    <option value="3">ബ്ലോക്ക് പഞ്ചായത്ത്</option>
    <option value="4">ജില്ലാ പഞ്ചായത്ത്</option>
    <option value="5" selected="selected">ഗ്രാമ പഞ്ചായത്ത്</option>
  </select>

  <select name="ctl00$ContentPlaceHolder1$ddlYear" id="ctl00_ContentPlaceHolder1_ddlYear">
    <option value="0">----വർഷം----</option>
    <option value="34">2023</option>
    <option value="35">2024</option>
    <option value="36" selected="selected">2025</option>
  </select>

  <select name="ctl00$ContentPlaceHolder1$ddlMainGroup" id="ctl00_ContentPlaceHolder1_ddlMainGroup">
    <option value="0">----ഗ്രൂപ്പ്----</option>
    <option value="1">ഭരണസമിതി</option>
    <option value="2" selected="selected">ഭരണസമിതി</option>
    <option value="3">വികസന സമിതി</option>
    <option value="4">ക്ഷേമ സമിതി</option>
  </select>

  <select name="ctl00$ContentPlaceHolder1$ddlLBName" id="ctl00_ContentPlaceHolder1_ddlLBName">
    <option value="0">----തദ്ദേശ സ്ഥാപനം----</option>
    <option value="301">ഓടനാവട്ടം</option>
    <option value="302">ഓലവണ്ണ</option>
    <option value="303" selected="selected">ഓച്ചിറ</option>
    <option value="304">കടക്കൽ</option>
  </select>

  <!-- KPI cards -->
  <div class="row kpi-row">

    <div class="col kpi-card">
      <h3 id="ctl00_ContentPlaceHolder1_lblTotal">34</h3>
      <p>ആകെ യോഗങ്ങൾ</p>
      <input type="submit"
             name="ctl00$ContentPlaceHolder1$btnBefore_Meetings"
             id="ctl00_ContentPlaceHolder1_btnBefore_Meetings"
             value="View" />
    </div>

    <div class="col kpi-card">
      <h3 id="ctl00_ContentPlaceHolder1_lblOngoing">0</h3>
      <p>ചേരുന്ന യോഗങ്ങള്‍</p>
      <input type="submit"
             name="ctl00$ContentPlaceHolder1$btnBefore_Meetings"
             id="ctl00_ContentPlaceHolder1_btnOngoing"
             value="View" />
    </div>

    <div class="col kpi-card">
      <h3 id="ctl00_ContentPlaceHolder1_lblMinComp">34</h3>
      <p>മിനിറ്റ്സ് പൂര്‍ത്തിയായവ</p>
      <input type="submit"
             name="ctl00$ContentPlaceHolder1$btnAppv_Meetings"
             id="ctl00_ContentPlaceHolder1_btnAppv_Meetings"
             value="View" />
    </div>

    <div class="col kpi-card">
      <h3 id="ctl00_ContentPlaceHolder1_lblMinIncomp">0</h3>
      <p>മിനിറ്റ്സ് പൂര്‍ത്തിയാകാത്തവ</p>
      <input type="submit"
             name="ctl00$ContentPlaceHolder1$btnInComp_Meetings"
             id="ctl00_ContentPlaceHolder1_btnInComp_Meetings"
             value="View" />
    </div>

    <div class="col kpi-card">
      <h3 id="ctl00_ContentPlaceHolder1_lblCancelled">0</h3>
      <p>മീറ്റിംഗ് റദ്ദ്‌ ആക്കിയവ</p>
      <input type="submit"
             name="ctl00$ContentPlaceHolder1$btnCancelDetails"
             id="ctl00_ContentPlaceHolder1_btnCancelDetails"
             value="View" />
    </div>

  </div><!-- /.kpi-row -->

</div><!-- /#ContentPlaceHolder1 -->
</form>
</body>
</html>
