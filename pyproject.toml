[project]
name = "sulekha"
version = "0.1.0"
description = "Data extraction service for Sulekha municipal project documents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    
    # Task Queue
    "celery[redis]>=5.3",
    "redis>=5.0",
    "flower>=2.0",
    
    # Scraping
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "tenacity>=8.2",
    
    # Cloud Storage
    "google-cloud-storage>=2.14",
    
    # Observability
    "structlog>=24.0",
    "python-json-logger>=2.0",
    
    # Utilities
    "python-dotenv>=1.0",
    "click>=8.1",
    "flask>=3.0",
    
    # Dashboard
    "streamlit>=1.30",

    # Elections data_merge (PDF text extraction; no network dependency)
    "pypdf>=5.0",

    # Boundary geometry (src/geo): vector-tile decode, polygon assembly, map render
    "mapbox-vector-tile>=2.0",
    "shapely>=2.0",
    "matplotlib>=3.8",
]

[project.scripts]
sulekha = "sulekha.cli:main"
data-merge = "data_merge.cli:main"
geo = "geo.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "pytest-docker>=3.0",
    "responses>=0.25",
    "minio>=7.2",
    "boto3>=1.34",
    "ruff>=0.2",
    "mypy>=1.8",
    "testcontainers>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sulekha", "src/data_merge", "src/geo"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
