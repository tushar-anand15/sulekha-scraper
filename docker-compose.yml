# Sulekha Data Extraction Service - Docker Compose Configuration
# 
# Usage:
#   make up                                 # Start all services with 4 workers (ALWAYS use this)
#   docker compose up -d --scale worker=4   # Same - scale is NOT persisted, use make up
#   docker compose --profile migrate up migrate  # Run migrations
#   docker compose logs -f worker           # Follow worker logs
#   docker compose logs -f dashboard        # Follow dashboard logs
#   docker compose exec worker sulekha progress  # Check progress
#   docker compose up -d --scale worker=4   # Scale workers
#   docker compose down                     # Stop all services
#   docker compose down -v                  # Stop and remove volumes
#
# Access:
#   - Dashboard: http://localhost:8765
#   - Flower: http://localhost:5555
#   - PostgreSQL: localhost:5432 (sulekha/sulekha)
#   - Redis: localhost:6379

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: sulekha-postgres
    environment:
      POSTGRES_USER: sulekha
      POSTGRES_PASSWORD: sulekha
      POSTGRES_DB: sulekha
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sulekha"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis (Celery Broker)
  redis:
    image: redis:7-alpine
    container_name: sulekha-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Celery Worker (Scraping)
  # IMPORTANT: Scale is NOT persisted. After any "docker compose up", run:
  #   make scale-workers   (or: docker compose up -d --scale worker=4)
  # Then run: make restart-workers   (so all 4 workers start together and share tasks)
  worker:
    build: .
    # container_name removed to allow scaling
    command: >
      celery -A sulekha.tasks.celery_app worker
      --loglevel=INFO
      -Q default,discovery,scraper,pdf,orchestrator
      --max-tasks-per-child=100
    environment:
      - DATABASE_URL=postgresql+psycopg://sulekha:sulekha@postgres:5432/sulekha
      - REDIS_URL=redis://redis:6379/0
      # GCS Storage Configuration
      - STORAGE_BACKEND=gcs
      - GCS_BUCKET_NAME=sulekha-pdfs
      - GCS_PROJECT_ID=sulekha-487304
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/gcs-key.json
      # Rate limiting - global concurrency control
      - RATE_LIMIT_ENABLED=true
      - RATE_LIMIT_MAX_CONCURRENT=32
      # Random delay range between requests
      - SCRAPER_DELAY_MIN=0.5
      - SCRAPER_DELAY_MAX=1.5
      - LOG_LEVEL=INFO
      - LOG_FORMAT=console
      - CELERY_WORKER_CONCURRENCY=12
    volumes:
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
      - ./credentials/sulekha-487304-4f5a021dcc1c.json:/app/credentials/gcs-key.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Celery Beat Scheduler
  beat:
    build: .
    container_name: sulekha-beat
    command: >
      celery -A sulekha.tasks.celery_app beat
      --loglevel=INFO
    environment:
      - DATABASE_URL=postgresql+psycopg://sulekha:sulekha@postgres:5432/sulekha
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=INFO
      - LOG_FORMAT=console
    volumes:
      - ./src:/app/src:ro
      - beat_data:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # PDF Orchestrator - keeps the pdf queue fed (must run for workers to have work)
  orchestrator:
    build: .
    container_name: sulekha-orchestrator
    command: sulekha run-pdfs --batch-size=100 --max-queue=2000
    environment:
      - DATABASE_URL=postgresql+psycopg://sulekha:sulekha@postgres:5432/sulekha
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_BACKEND=gcs
    volumes:
      - ./src:/app/src:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # PDF Dashboard
  dashboard:
    build: .
    container_name: sulekha-dashboard
    command: python scripts/dashboard.py --port 8765
    environment:
      - DATABASE_URL=postgresql+psycopg://sulekha:sulekha@postgres:5432/sulekha
    volumes:
      - ./scripts:/app/scripts:ro
    ports:
      - "8765:8765"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Flower Monitoring UI
  flower:
    build: .
    container_name: sulekha-flower
    command: >
      celery -A sulekha.tasks.celery_app flower
      --port=5555
      --broker=redis://redis:6379/0
      --persistent=True
      --purge_offline_workers=300
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+psycopg://sulekha:sulekha@postgres:5432/sulekha
      - STORAGE_BACKEND=gcs
    ports:
      - "5555:5555"
    depends_on:
      - redis
    restart: unless-stopped

  # Database Migration Runner (one-off)
  migrate:
    build: .
    container_name: sulekha-migrate
    command: >
      sh -c "
        python -c 'from sulekha.db.session import init_db; init_db()' &&
        echo 'Database initialized'
      "
    environment:
      - DATABASE_URL=postgresql+psycopg://sulekha:sulekha@postgres:5432/sulekha
      - STORAGE_BACKEND=gcs
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - migrate

  # ============================================================================
  # SAKARMA Services (sister scraper for meeting.lsgkerala.gov.in)
  # Same Postgres + Redis; separate Celery app, queues, GCS bucket.
  # ============================================================================

  sakarma-worker:
    build: .
    command: >
      celery -A sakarma.tasks.celery_app worker
      --loglevel=INFO
      -Q sakarma_orchestrate,sakarma_manifest,sakarma_fetch,sakarma_reconcile,sakarma_discovery,sakarma_default
      --max-tasks-per-child=50
    environment:
      - SAKARMA_DATABASE_URL=postgresql+psycopg://sulekha:sulekha@postgres:5432/sulekha
      - SAKARMA_REDIS_URL=redis://redis:6379/0
      - SAKARMA_STORAGE_BACKEND=gcs
      - SAKARMA_GCS_BUCKET_NAME=${SAKARMA_GCS_BUCKET_NAME:-sakarma-meetings}
      - SAKARMA_GCS_PROJECT_ID=${SAKARMA_GCS_PROJECT_ID:-}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/gcs-key.json
      - SAKARMA_RATE_LIMIT_ENABLED=true
      - SAKARMA_RATE_LIMIT_MAX_CONCURRENT=4
      - SAKARMA_SCRAPER_DELAY_MIN=0.5
      - SAKARMA_SCRAPER_DELAY_MAX=1.5
      - SAKARMA_LOG_LEVEL=INFO
      - SAKARMA_LOG_FORMAT=console
      - SAKARMA_CELERY_WORKER_CONCURRENCY=4
    volumes:
      - ./src:/app/src:ro
      - ./credentials/sulekha-487304-4f5a021dcc1c.json:/app/credentials/gcs-key.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - sakarma

  sakarma-flower:
    build: .
    container_name: sakarma-flower
    command: >
      celery -A sakarma.tasks.celery_app flower
      --port=5556
      --broker=redis://redis:6379/0
      --persistent=True
      --purge_offline_workers=300
    environment:
      - SAKARMA_REDIS_URL=redis://redis:6379/0
      - SAKARMA_DATABASE_URL=postgresql+psycopg://sulekha:sulekha@postgres:5432/sulekha
    ports:
      - "5556:5556"
    depends_on:
      - redis
    restart: unless-stopped
    profiles:
      - sakarma

  sakarma-migrate:
    build: .
    container_name: sakarma-migrate
    command: alembic -c alembic_sakarma.ini upgrade head
    environment:
      - SAKARMA_DATABASE_URL=postgresql+psycopg://sulekha:sulekha@postgres:5432/sulekha
    volumes:
      - ./src:/app/src:ro
      - ./alembic_sakarma:/app/alembic_sakarma:ro
      - ./alembic_sakarma.ini:/app/alembic_sakarma.ini:ro
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - migrate-sakarma

  # Live dashboard. Bound to 127.0.0.1 only — never exposed publicly.
  # Access via SSH tunnel:
  #   gcloud compute ssh sakarma-scraper -- -L 8766:localhost:8766
  #   open http://localhost:8766
  sakarma-dashboard:
    build: .
    container_name: sakarma-dashboard
    command: >
      streamlit run scripts/sakarma_dashboard.py
      --server.port=8766
      --server.address=0.0.0.0
      --server.headless=true
      --browser.gatherUsageStats=false
    environment:
      - SAKARMA_DATABASE_URL=postgresql+psycopg://sulekha:sulekha@postgres:5432/sulekha
      - SAKARMA_DASHBOARD_REFRESH_SECONDS=30
    volumes:
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
    ports:
      - "127.0.0.1:8766:8766"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - sakarma

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  beat_data:
    driver: local

networks:
  default:
    name: sulekha-network
